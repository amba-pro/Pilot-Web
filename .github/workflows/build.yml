name: Pilot-Web balloon plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Verify installation ZIP and prepare direct-download artifact
        run: |
          mkdir -p dist/installable/frontend
          cp dist/frontend/* dist/installable/frontend/
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          with ZipFile("dist/balloon-pop-pilot-web.zip") as package:
              names = set(package.namelist())
              assert "frontend/extensions.config.json" in names, names
              assert "frontend/balloon-pop.js" in names, names
              manifest = json.loads(package.read("frontend/extensions.config.json"))
              assert manifest["extension"]["entry"] == "balloon-pop.js"
          assert Path("dist/installable/frontend/extensions.config.json").is_file()
          assert Path("dist/installable/frontend/balloon-pop.js").is_file()
          print("Validated frontend/ archive root and manifest")
          PY
      - uses: actions/upload-artifact@v4
        with:
          # Downloaded artifact ZIP contains frontend/ at its root,
          # so it can be uploaded straight to the Pilot-Web Web-extension UI.
          name: balloon-pop-pilot-web-INSTALL
          path: dist/installable/
          if-no-files-found: error
